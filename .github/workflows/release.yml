name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify before release
        run: ./init.sh

      - name: Install npm with staged publishing support
        run: npm install -g 'npm@^11.15.0'

      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Check for a new package version
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: candidate
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          const file = 'packages/react-gantt/package.json';
          const current = JSON.parse(readFileSync(file, 'utf8')).version;
          let changed = process.env.EVENT_NAME === 'workflow_dispatch';
          if (!changed && process.env.BEFORE && !/^0+$/.test(process.env.BEFORE)) {
            const previous = JSON.parse(execFileSync('git', ['show', `${process.env.BEFORE}:${file}`], { encoding: 'utf8' })).version;
            changed = current !== previous;
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `stage=${changed}\n`);
          NODE

      - name: Stage package for npm approval
        if: steps.candidate.outputs.stage == 'true'
        run: pnpm release
