name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # required for npm trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Trusted publishing needs npm >= 11.5.1, and pnpm has no native OIDC
      # support (pnpm#9812) — `pnpm publish` shells out to whatever npm is on
      # PATH, so it is the runner's npm that has to clear the floor, not the
      # pinned pnpm. Without this the publish fails as a misleading E404.
      - run: npm install -g npm@latest

      # Opens a "Version Packages" PR while changesets are pending; publishes
      # once that PR is merged and none are left.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
