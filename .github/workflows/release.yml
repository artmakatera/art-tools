name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # required for npm trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pinned to 11.x, and both bounds are load-bearing. Floor: trusted
      # publishing needs npm >= 11.5.1, and pnpm has no native OIDC support
      # (pnpm#9812) — it shells out to whatever npm is on PATH, so the runner's
      # npm is what must clear it, not the pinned pnpm. Ceiling: npm 12 changed
      # `info --json` to return an array, and changesets 3.0.1's pnpm path
      # parses that without unwrapping (its npm path does unwrap), so
      # `publishedVersions` lands undefined and publish dies on a TypeError
      # reading 'includes'. Do not move this to @latest.
      - run: npm install -g npm@11

      # Opens a "Version Packages" PR while changesets are pending; publishes
      # once that PR is merged and none are left.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
